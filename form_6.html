<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" type="text/css" href="css/form6.css" />

    <title>CS Form No. 6 - Leave Form Revised 2020</title>
    <style></style>
  </head>
  <body>
    <div class="page-container">
      <div class="ict-header">ICT</div>

      <div class="container">
        <header>
          <div class="logo">
            <img
              src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' fill='%2397d700'%3E%3Ccircle cx='50' cy='50' r='45'/%3E%3C/svg%3E"
              alt="Logo"
            />
            <span>SDO Tayabas</span>
          </div>
        </header>

        <div class="form-container">
          <a href="forms.html" class="back-btn">Back</a>

          <h1 class="form-title">
            CS Form No. 6<br />
            Application for Leave
          </h1>
          <br />

          <form
            id="myForm"
            action="F6submit.php"
            method="POST"
            enctype="multipart/form-data"
          >
            <div class="flex-input-wrapper">
              <div class="form-group" style="margin-top: -25px">
                <label for="department">Office/Department</label>
                <select
                  id="department"
                  name="department"
                  style="height: 34px"
                  required
                >
                  <option value="" disabled selected>
                    -- Select Department --
                  </option>
                  <option value="Accounting">Accounting</option>
                  <option value="Administrative Office">
                    Administrative Office
                  </option>
                  <option value="Budget">Budget</option>
                  <option value="Cash">Cash</option>
                  <option value="CID">CID</option>
                  <option value="EFS">EFS</option>
                  <option value="Health">Health</option>
                  <option value="Legal">Legal</option>
                  <option value="Library Hub">Library Hub</option>
                  <option value="LRMD">LRMD</option>
                  <option value="Office of the ASDS">Office of the ASDS</option>
                  <option value="Office of the SDS">Office of the SDS</option>
                  <option value="Personnel">Personnel</option>
                  <option value="Planning">Planning</option>
                  <option value="Private School">Private School</option>
                  <option value="Procurement">Procurement</option>
                  <option value="Property and Supply">
                    Property and Supply
                  </option>
                  <option value="Records">Records</option>
                  <option value="Research">Research</option>
                  <option value="SGOD">SGOD</option>
                </select>
              </div>
              <div class="form-group" style="margin-top: -25px">
                <label class="label">Name</label>
                <input
                  type="text"
                  id="last_name"
                  name="last_name"
                  placeholder="Last Name"
                  required
                />
              </div>
              <div class="form-group">
                <input
                  type="text"
                  id="first_name"
                  name="first_name"
                  placeholder="First Name"
                  required
                />
              </div>
              <div class="form-group">
                <input
                  type="text"
                  id="middle_name"
                  name="middle_name"
                  placeholder="Middle Name"
                  required
                />
              </div>
            </div>

            <div class="flex-input-wrapper">
              <div class="form-group">
                <label class="label" for="position">Email Adress</label>
                <input
                  type="email"
                  id="email"
                  name="email"
                  style="min-width: 260px"
                  placeholder="Enter your email"
                  required
                />
              </div>
              <div class="form-group">
                <label class="label" for="date_of_filing">Date of Filing</label>
                <input
                  type="date"
                  id="date_of_filing"
                  name="date_of_filing"
                  style="height: 34px"
                  placeholder="month/day/year"
                  required
                />
              </div>
              <div class="form-group">
                <label class="label" for="position">Position</label>
                <input
                  type="text"
                  id="position"
                  name="position"
                  style="min-width: 260px"
                  placeholder="Your position"
                  required
                />
              </div>
              <div class="form-group">
                <label class="label" for="salary">Salary</label>
                <input
                  type="text"
                  id="salary"
                  name="salary"
                  style="min-width: 260px"
                  placeholder="Your salary"
                  required
                />
              </div>
            </div>

            <!-- <div class="form-group">
              <label for="date">Date Reported</label>
              <input type="date" id="date" name="date" required />
            </div> -->
            <div class="types_of_leave">
              <div class="form-group formgroup_a">
                <label><strong>A. TYPE OF LEAVE BE AVAILED OF</strong></label>
                <div class="checkbox-group">
                  <div class="checkbox-option">
                    <label for="vacation_leave">
                      <input
                        type="checkbox"
                        id="vacation_leave"
                        name="selectedOptions[]"
                        value="Vacation Leave"
                      />
                      Vacation Leave (Sec. 51, Rule XVI, Omnibus Rules
                      Implementing E.O. No. 292)
                    </label>
                  </div>

                  <div class="checkbox-option">
                    <label for="mandatory_forced_leave">
                      <input
                        type="checkbox"
                        id="mandatory_forced_leave"
                        name="selectedOptions[]"
                        value="Mandatory / Forced Leave"
                      />
                      Mandatory/Forced Leave(Sec. 25, Rule XVI, Omnibus Rules
                      Implementing E.O. No. 292)
                    </label>
                  </div>

                  <div class="checkbox-option">
                    <label for="sick-leave">
                      <input
                        type="checkbox"
                        id="sick-leave"
                        name="selectedOptions[]"
                        value="Sick Leave"
                      />Sick Leave (Sec. 43, Rule XVI, Omnibus Rules
                      Implementing E.O. No. 292)
                    </label>
                  </div>

                  <div class="checkbox-option">
                    <label for="maternity_leave">
                      <input
                        type="checkbox"
                        id="maternity_leave"
                        name="selectedOptions[]"
                        value="Maternity Leave"
                      />Maternity Leave (R.A. No. 11210 / IRR issued by CSC,
                      DOLE and SSS)
                    </label>
                  </div>
                  <div class="checkbox-option">
                    <label for="paternity_leave">
                      <input
                        type="checkbox"
                        id="paternity_leave"
                        name="selectedOptions[]"
                        value="Paternity Leave"
                      />Paternity Leave (R.A. No. 8187 / CSC MC No. 71, s. 1998,
                      as amended)
                    </label>
                  </div>

                  <div class="checkbox-option">
                    <label for="special_privilege_leave">
                      <input
                        type="checkbox"
                        id="special_privilege_leave"
                        name="selectedOptions[]"
                        value="Special Privilege Leave"
                      />Special Privilege Leave (Sec. 21, Rule XVI, Omnibus
                      Rules Implementing E.O. No. 292)
                    </label>
                  </div>

                  <div class="checkbox-option">
                    <label for="solo_parent_leave">
                      <input
                        type="checkbox"
                        id="solo_parent_leave"
                        name="selectedOptions[]"
                        value="Solo Parent Leave"
                      />Solo Parent Leave (RA No. 8972 / CSC MC No. 8, s. 2004)
                    </label>
                  </div>

                  <div class="checkbox-option">
                    <label for="study_leave">
                      <input
                        type="checkbox"
                        id="study_leave"
                        name="selectedOptions[]"
                        value="Study Leave"
                      />Study Leave (Sec. 68, Rule XVI, Omnibus Rules
                      Implementing E.O. No. 292)
                    </label>
                  </div>

                  <div class="checkbox-option">
                    <label for="10day_VAWC_leave">
                      <input
                        type="checkbox"
                        id="10day_VAWC_leave"
                        name="selectedOptions[]"
                        value="10-Day VAWC Leave"
                      />10-Day VAWC Leave (RA No. 9262 / CSC MC No. 15, s. 2005)
                    </label>
                  </div>

                  <div class="checkbox-option">
                    <label for="rehabilitation_privilege">
                      <input
                        type="checkbox"
                        id="rehabilitation_privilege"
                        name="selectedOptions[]"
                        value="Rehabilitation Privilege"
                      />Rehabilitation Privilege (Sec. 55, Rule XVI, Omnibus
                      Rules Implementing E.O. No. 292)
                    </label>
                  </div>

                  <div class="checkbox-option">
                    <label for="special_leave_benefits_for_women">
                      <input
                        type="checkbox"
                        id="special_leave_benefits_for_women"
                        name="selectedOptions[]"
                        value="Special Leave Benefits for Women"
                      />Special Leave Benefits for Women (RA No. 9710 / CSC MC
                      No. 25, s. 2010)
                    </label>
                  </div>

                  <div class="checkbox-option">
                    <label for="special_emergency">
                      <input
                        type="checkbox"
                        id="special_emergency"
                        name="selectedOptions[]"
                        value="Special Emergency"
                      />Special Emergency (Calamity) Leave (CSC MC No. 2, s.
                      2012, as amended)
                    </label>
                  </div>

                  <div class="checkbox-option">
                    <label for="adoption_leave">
                      <input
                        type="checkbox"
                        id="adoption_leave"
                        name="selectedOptions[]"
                        value="Adoption Leave"
                      />Adoption Leave(R.A. No. 8552)
                    </label>
                  </div>

                  <div class="checkbox-option">
                    <label for="others">
                      <input
                        type="checkbox"
                        id="others"
                        name="selectedOptions[]"
                        value="Others"
                      />
                      Others:
                      <input
                        class="others_text_wrapper"
                        type="text"
                        id="others_text"
                        name="others_text"
                        disabled
                      />
                    </label>
                  </div>
                </div>
              </div>
              <hr />

              <div class="form-group formgroup_b">
                <label><strong>B. DETAILS OF LEAVE</strong></label>
                <div class="checkbox-group">
                  <label
                    ><em
                      >In case of Vacation/Special Privilege Leave:</em
                    ></label
                  >
                  <div class="checkbox-option b-check-options">
                    <label for="Within the Philippines">
                      <input
                        type="checkbox"
                        id="within_ph"
                        name="specificationOptions[]"
                        value="Within the Philippines"
                      />
                      Within the Philipines
                    </label>
                    <input
                      class="input_text"
                      type="text"
                      id="within_ph_text"
                      name="within_ph_text"
                      disabled
                    />
                  </div>

                  <div class="checkbox-option b-check-options">
                    <label for="Abroad">
                      <input
                        type="checkbox"
                        id="abroad"
                        name="specificationOptions[]"
                        value="Abroad"
                      />
                      Abroad (Specify)
                    </label>
                    <input
                      class="input_text"
                      type="text"
                      id="abroad_text"
                      name="abroad_text"
                      disabled
                    />
                  </div>
                  <label><em>In case of Sick Leave:</em></label>
                  <div class="checkbox-option b-check-options">
                    <label for="In Hospital">
                      <input
                        type="checkbox"
                        id="in_hospital"
                        name="specificationOptions[]"
                        value="In Hospital"
                      />
                      In Hospital (Specify Illness)
                    </label>
                    <input
                      class="input_text"
                      type="text"
                      id="in_hospital_text"
                      name="in_hospital_text"
                      disabled
                    />
                  </div>

                  <div class="checkbox-option b-check-options">
                    <label for="Out Patient">
                      <input
                        type="checkbox"
                        id="out_patient"
                        name="specificationOptions[]"
                        value="Out Patient"
                      />
                      Out Patient (Specify Illness)
                    </label>
                    <input
                      class="input_text"
                      type="text"
                      id="out_patient_text"
                      name="out_patient_text"
                      disabled
                    />
                  </div>

                  <label
                    ><em
                      >In case of Special Leave Benefits for Women:</em
                    ></label
                  >
                  <div class="checkbox-option b-check-options">
                    <label for="SpecialLeave-BW">
                      (Specify Illness)
                      <input
                        class="input_text"
                        type="text"
                        id="special_leave_BW_spec"
                        name="special_leave_BW_spec"
                        disabled
                      />
                    </label>
                  </div>
                  <label><em>In case of Study Leave:</em></label>
                  <div class="checkbox-option b-check-options">
                    <label for="Completion of Master's Degree">
                      <input
                        type="checkbox"
                        id="completion_of_masters_degree"
                        name="completion_of_masters_degree"
                        value="Completion of Master's Degree"
                      />
                      Completion of Master's Degree
                    </label>
                  </div>
                  <div class="checkbox-option b-check-options">
                    <label for="BAR/Board Examination Review">
                      <input
                        type="checkbox"
                        id="BAR_Board_exam"
                        name="BAR_Board_exam"
                        value="BAR/Board Examination Review"
                      />
                      BAR/Board Examination Review
                    </label>
                  </div>

                  <label><em>Other purpose:</em></label>
                  <div class="checkbox-option b-check-options">
                    <label for="Monetization of Leave Credits">
                      <input
                        type="checkbox"
                        id="monetization_of_leave_credits"
                        name="otherPurpose[]"
                        value="Monetization of Leave Credits"
                      />
                      Monetization of Leave Credits
                    </label>
                  </div>
                  <div class="checkbox-option b-check-options">
                    <label for="Terminal Leave">
                      <input
                        type="checkbox"
                        id="terminal_leave"
                        name="otherPurpose[]"
                        value="Terminal Leave"
                      />
                      Terminal Leave
                    </label>
                  </div>
                </div>
              </div>
            </div>
            <hr />
            <div class="d-container">
              <div class="form-group d-container-checkbox">
                <label
                  ><strong>C. NUMBER OF WORKING DAYS APPLIED FOR</strong></label
                >
                <div class="checkbox-option">
                  <input
                    type="text"
                    id="number_of_days_applied"
                    name="number_of_days_applied"
                    placeholder="No. of days"
                    style="width: 100%; margin-bottom: 10px"
                  />
                  <label><strong>INCLUSIVE DAYS</strong></label>
                  <div class="checkbox-option">
                    <input
                      type="text"
                      id="inclusive_days"
                      name="inclusive_days"
                      placeholder="month/day/year"
                      style="width: 100%"
                    />
                  </div>
                </div>
              </div>

              <div class="form-group d-container-right">
                <label><strong>D. COMMUNICATION</strong></label>
                <div class="checkbox-option">
                  <label>
                    <input
                      type="checkbox"
                      id="not_required"
                      name="communication[]"
                      value="Not Required"
                    />
                    Not Required</label
                  >

                  <div class="checkbox-option">
                    <label>
                      <input
                        type="checkbox"
                        id="required"
                        name="communication[]"
                        value="Required"
                      />

                      Required</label
                    >
                  </div>
                </div>
                <div class="e-sign-container">
                  <label for="e-sign-input">Upload E-Signature:</label>
                  <input
                    type="file"
                    id="e-sign-input"
                    name="file"
                    accept=".png"
                    required
                  />
                </div>
              </div>
            </div>
            <hr />
            <div class="form-group" style="text-align: center">
              <label><strong>SIGNATORY</strong></label>
              <div class="checkbox-option">
                <input
                  type="text"
                  id="name_of_official"
                  name="name_of_official"
                  style="width: 300px; text-align: center"
                  placeholder="Full Name"
                />
                <hr style="width: 300px" />
                <div class="checkbox-option">
                  <input
                    type="text"
                    id="signatory_position"
                    name="signatory_position"
                    style="width: 300px; text-align: center"
                    placeholder="Position"
                  />
                </div>
                <label><strong>(Authorize Official)</strong></label>
              </div>
            </div>

            <!-- <div class="form-group">
              <label for="description">Details/Description</label>
              <textarea id="description" name="description" required></textarea>
            </div> -->

            <div class="form-buttons">
              <button
                type="button"
                class="cancel-btn"
                onclick="location.href='forms.html'"
              >
                Cancel
              </button>
              <button type="submit" name="submit" class="submit-btn">
                Submit
              </button>
            </div>
          </form>
          <div
            id="notification"
            style="
              display: none;
              padding: 10px;
              background: #4caf50;
              color: white;
              text-align: center;
              margin-top: 10px;
            "
          >
            Your application has been submitted successfully!
          </div>
        </div>
      </div>
    </div>
    <script src="js/Form6.js"></script>
  </body>
</html>
